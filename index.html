<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>間違い探しゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>間違い探し</h1>
            <div id="stats">
                <div class="stat-item">残り時間: <span id="timer">60</span>秒</div>
                <div class="stat-item">見つけた数: <span id="score">0</span> / <span id="total-diffs">0</span></div>
            </div>
        </header>

        <main id="game-board">
            <div class="image-wrapper" id="original-wrapper">
                <img id="original-img" src="" alt="Original">
                <div class="overlay" id="original-overlay"></div>
            </div>
            <div class="image-wrapper" id="modified-wrapper">
                <img id="modified-img" src="" alt="Modified">
                <div class="overlay" id="modified-overlay"></div>
            </div>
        </main>

        <div id="start-screen" class="screen active">
            <div class="screen-content">
                <h2>間違い探しゲーム</h2>
                <p>左右の画像を見比べて、違うところを見つけてね！</p>
                <button id="start-btn">ゲームスタート</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="screen-content">
                <h2 id="result-title">クリア！</h2>
                <p id="result-message"></p>
                <button id="restart-btn">もう一度遊ぶ</button>
            </div>
        </div>
    </div>

    <script src="levels.js"></script>
    <script src="script.js"></script>
</body>
</html>
