<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Sky and Ground -->
  <rect width="600" height="300" fill="#87CEEB" /> <!-- Sky -->
  <rect y="300" width="600" height="100" fill="#228B22" /> <!-- Grass -->
  
  <!-- Sun -->
  <circle cx="500" cy="70" r="40" fill="#FFD700" />
  
  <!-- House -->
  <rect x="100" y="200" width="150" height="150" fill="#D2691E" />
  <polygon points="100,200 175,120 250,200" fill="#8B4513" /> <!-- Roof -->
  <rect x="150" y="270" width="40" height="80" fill="#5D2906" /> <!-- Door -->
  <rect x="120" y="230" width="30" height="30" fill="#ADD8E6" /> <!-- Window 1 -->
  <rect x="190" y="230" width="30" height="30" fill="#ADD8E6" /> <!-- Window 2 -->
  
  <!-- Tree -->
  <rect x="400" y="250" width="20" height="100" fill="#8B4513" /> <!-- Trunk -->
  <circle cx="410" cy="220" r="50" fill="#006400" /> <!-- Leaves -->
  
  <!-- Cloud -->
  <ellipse cx="200" cy="80" rx="40" ry="20" fill="white" />
  <ellipse cx="230" cy="90" rx="30" ry="15" fill="white" />
  <ellipse cx="170" cy="90" rx="30" ry="15" fill="white" />

  <!-- Flower -->
  <circle cx="500" cy="350" r="5" fill="red" />
  <circle cx="510" cy="360" r="5" fill="red" />
  <circle cx="490" cy="360" r="5" fill="red" />
</svg>
